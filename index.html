<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive Swagger UI documentation for FakeAPI static JSON endpoints.">
  <title>FakeAPI — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui.css">
  <style>body { margin: 0; background: #fafafa; } .swagger-ui .topbar { display: none; }</style>
</head>
<body>
  <noscript>Enable JavaScript to use Swagger UI. <a href="./openapi.json">Download the OpenAPI specification</a> or <a href="./todos.json">view todo data</a>.</noscript>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui-bundle.js" crossorigin="anonymous"></script>
  <script>
    window.onload = function () {
      if (typeof SwaggerUIBundle !== "function") {
        document.getElementById("swagger-ui").textContent =
          "Swagger UI could not load. Refresh the page or download the specification at openapi.json.";
        return;
      }
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        supportedSubmitMethods: ["get"],
        validatorUrl: null
      });
    };
  </script>
</body>
</html>
